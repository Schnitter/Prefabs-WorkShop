<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prefabs Workshop – Spacelab</title>

  <!-- Lokales Bootswatch Spacelab -->
  <link href="css/bootstrap.min.css" rel="stylesheet">

  <link rel="icon" href="assets/favicon.png">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">🧱 Prefabs Workshop</a>
    </div>
  </nav>

  <header class="py-5 text-center bg-light border-bottom shadow-sm">
    <div class="container">
      <h1 class="display-5 fw-bold">Prefabs Workshop</h1>
      <p class="lead mb-4">VineaTech · Architektur-Sets mit Bootswatch Spacelab</p>
      <a href="#gallery" class="btn btn-primary btn-lg">Galerie anzeigen</a>
    </div>
  </header>

  <main class="container my-5">
    <div id="gallery" class="row g-4"></div>
  </main>

  <footer class="text-center py-4 bg-dark text-light mt-auto">
    <p class="mb-0">© 2025 VineaTech · Project:Prefabs Workshop</p>
  </footer>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script>
    fetch('data/prefabs.json')
      .then(r => r.json())
      .then(d => {
        const g = document.getElementById('gallery');
        d.prefabs.forEach(p => {
          g.innerHTML += `
            <div class="col-12 col-md-6 col-lg-4">
              <div class="card h-100 shadow-sm">
                <img src="${p.image}" class="card-img-top" alt="${p.name}">
                <div class="card-body">
                  <h5 class="card-title">${p.name}</h5>
                  <p class="card-text">${p.desc}</p>
                </div>
                <div class="card-footer bg-transparent border-top-0">
                  <a href="${p.github}" target="_blank" class="btn btn-outline-primary w-100">GitHub öffnen</a>
                </div>
              </div>
            </div>`;
        });
      });
  </script>
</body>
</html>
